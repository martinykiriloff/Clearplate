name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clearplate
          POSTGRES_PASSWORD: clearplate
          POSTGRES_DB: clearplate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clearplate" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://clearplate:clearplate@localhost:5432/clearplate_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clearplate/targets build
      - run: pnpm --filter @clearplate/targets test
      - run: pnpm --filter @clearplate/api lint
      - run: pnpm --filter @clearplate/api test:e2e
      - run: pnpm --filter @clearplate/web lint
      - run: pnpm --filter @clearplate/web build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
